<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>혼젠 점심 메뉴 선택</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#252821;font:16px/1.55 system-ui,sans-serif}main{max-width:38rem;margin:auto;padding:2rem 1rem}header{margin-bottom:1.25rem}h1{margin:.2rem 0;font-size:2rem}p{margin:.45rem 0}form{padding:1.2rem;background:#fff;border:1px solid #dedbd1;border-radius:18px}fieldset{margin:0;padding:0;border:0}legend{font-weight:700;margin-bottom:.75rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(9rem,100%),1fr));gap:.5rem}.grid label{display:flex;align-items:center;gap:.35rem;padding:.55rem;border:1px solid #dedbd1;border-radius:8px}.grid label:has(:checked){border-color:#255744;background:#edf6ef}input,button,textarea{font:inherit}input[type=text],textarea{display:block;width:100%;padding:.65rem;border:1px solid #777;border-radius:8px}button{width:100%;margin-top:1rem;padding:.75rem;border:0;border-radius:8px;background:#255744;color:white;font-weight:700;cursor:pointer}#result{margin-top:1rem}a{color:#255744}.note{margin:.8rem 0;color:#484c42}
</style></head><body><main><header><p>11월 18일 수요일 · 세종 아름동</p><h1>혼젠 점심 메뉴 선택</h1><p>드실 메뉴를 하나 골라 주문 메시지를 복사한 뒤, 안내를 받으신 카카오톡 대화방에 보내 주세요.</p></header>
<form id="order"><fieldset><legend>드실 메뉴</legend><div class="grid"><label><input type="radio" name="menu" value="규동" required>규동</label><label><input type="radio" name="menu" value="부타동" >부타동</label><label><input type="radio" name="menu" value="가츠동" >가츠동</label><label><input type="radio" name="menu" value="돈코츠라멘" >돈코츠라멘</label><label><input type="radio" name="menu" value="카라이라멘" >카라이라멘</label><label><input type="radio" name="menu" value="나가사끼짬뽕" >나가사끼짬뽕</label><label><input type="radio" name="menu" value="돈카츠" >돈카츠</label><label><input type="radio" name="menu" value="치즈카츠" >치즈카츠</label><label><input type="radio" name="menu" value="카츠카레" >카츠카레</label><label><input type="radio" name="menu" value="에비카레" >에비카레</label><label><input type="radio" name="menu" value="가라아게커리" >가라아게커리</label><label><input type="radio" name="menu" value="스키나베" >스키나베</label><label><input type="radio" name="menu" value="가츠나베" >가츠나베</label><label><input type="radio" name="menu" value="토리나베" >토리나베</label><label><input type="radio" name="menu" value="기타" >기타</label></div></fieldset>
<p id="custom" hidden><label>메뉴 이름<input type="text" name="custom" maxlength="40" disabled></label></p>
<button type="submit">카톡에 보낼 주문 복사</button>
<div id="result" hidden><p id="status" role="status"></p><textarea id="message" rows="2" readonly aria-label="카카오톡에 보낼 주문 메시지"></textarea></div></form>
<p class="note"><a href="https://www.diningcode.com/profile.php?rid=gN9TiSVVlvw0">혼젠 메뉴 참고</a></p>
</main><script>
const form=document.querySelector('#order'), custom=document.querySelector('#custom'), result=document.querySelector('#result'), message=document.querySelector('#message'), statusText=document.querySelector('#status');
form.addEventListener('change',()=>{
  const enabled=form.elements.menu.value==='기타';
  custom.hidden=!enabled;
  form.elements.custom.disabled=!enabled;
  form.elements.custom.required=enabled;
  result.hidden=true;
  if(enabled) form.elements.custom.focus();
});
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const choice=form.elements.menu.value;
  const name=choice==='기타'?form.elements.custom.value.trim():choice;
  if(!name){form.elements.custom.focus();return;}
  message.value='[혼젠 점심] '+name+' 1개 부탁드립니다.';
  result.hidden=false;
  try{
    await navigator.clipboard.writeText(message.value);
    statusText.textContent='복사했습니다. 카카오톡에 붙여넣어 보내 주세요.';
  }catch{
    message.focus();
    message.select();
    statusText.textContent='아래 문구를 복사해 카카오톡에 보내 주세요.';
  }
});
</script></body></html>
