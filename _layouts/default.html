<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">E</span>
        <span>English Study Journal</span>
      </a>
      <nav class="nav-links" aria-label="블로그 메뉴">
        <a href="{{ '/' | relative_url }}" {% if page.daily_sentence != true and page.study_language == 'english' or page.study_language == nil %}aria-current="page"{% endif %}>영어 공부</a>
        <a href="{{ '/daily-sentence/' | relative_url }}" {% if page.daily_sentence %}aria-current="page"{% endif %}>매일 한 문장</a>
        <a href="{{ '/japanese/' | relative_url }}" {% if page.study_language == 'japanese' %}aria-current="page"{% endif %}>일본어 공부</a>
        <a href="{{ '/recipes/' | relative_url }}" {% if page.study_language == 'cooking' %}aria-current="page"{% endif %}>요리 레시피</a>
        {% if page.study_language == 'japanese' %}
        <a href="{{ '/japanese/#characters' | relative_url }}">문자 익히기</a>
        <a href="{{ '/japanese/#posts' | relative_url }}">일본어 학습 기록</a>
        {% elsif page.study_language == 'cooking' %}
        <a href="{{ '/recipes/#posts' | relative_url }}">레시피 목록</a>
        {% else %}
        <a href="{{ '/categories/' | relative_url }}">카테고리</a>
        <a href="{{ '/archive/' | relative_url }}">전체 기록</a>
        <a href="{{ '/#posts' | relative_url }}">최신 글</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="article-page">
    <div class="container article-container">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="brand footer-brand">
        <span class="brand-mark">E</span>
        <span>English Study Journal</span>
      </div>
      <p>Keep learning. Keep speaking. Keep improving.</p>
    </div>
  </footer>
</body>
</html>
